<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ISRO Gaganyaan MAITRI - Indian Space Research Organisation Landing Portal">
    <title>ISRO Gaganyaan | Entrance Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode landing-page">

    <!-- Cosmic Starfield Background Canvas -->
    <canvas id="starfieldCanvas"></canvas>

    <!-- ISRO Landing Portal Container -->
    <div class="landing-portal-container">
        <div class="isro-portal-header">
            <span class="portal-badge">🚀 GAGANYAAN DEEP-SPACE MISSION</span>
            <h1 class="portal-title">INDIAN SPACE RESEARCH ORGANISATION</h1>
            <p class="portal-subtitle">Multimodal AI for Total Resilience & Intelligence (MAITRI)</p>
        </div>

        <!-- Interactive Clickable ISRO Logo with Rocket Launch Engine -->
        <div class="isro-interactive-logo-wrapper" id="isroLaunchTrigger">
            <div class="logo-glow-ring"></div>
            
            <svg class="isro-landing-logo-svg" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Orange Rocket Plume / Satellite Wing -->
                <path class="logo-rocket-body" id="launchingRocket" d="M100 10 L140 120 L100 95 L60 120 Z" fill="#FF9933" />
                <path d="M30 75 L170 75 L100 30 Z" fill="#00A3E0" />
                <path d="M20 120 Q100 155 180 120" stroke="#FF9933" stroke-width="8" fill="none" />
            </svg>

            <!-- Thruster Flames (Hidden until clicked) -->
            <div class="rocket-thruster-flame" id="thrusterFlame"></div>
        </div>

        <!-- Call To Action Prompt -->
        <div class="launch-prompt-box">
            <span class="pulse-ring"></span>
            <span class="prompt-text">👉 CLICK THE ISRO EMBLEM TO LAUNCH GAGANYAAN MAITRI CORE</span>
        </div>

        <div class="launch-telemetry-status" id="launchStatusText">
            STATUS: AIR-GAP SYSTEM READY FOR ORBITAL INJECTION
        </div>
    </div>

    <script>
        // Interactive Rocket Launch Routing Script
        document.addEventListener('DOMContentLoaded', () => {
            const trigger = document.getElementById('isroLaunchTrigger');
            const rocket = document.getElementById('launchingRocket');
            const flame = document.getElementById('thrusterFlame');
            const statusText = document.getElementById('launchStatusText');

            if (!trigger) return;

            trigger.addEventListener('click', () => {
                trigger.classList.add('launching');
                if (flame) flame.classList.add('active');
                if (statusText) statusText.textContent = "IGNITION! LAUNCHING GAGANYAAN LMV3 ROCKET...";

                // Audio Launch Sound Effect (Web Audio API Synthesizer)
                playLaunchSound();

                // Route to dashboard.html after rocket launches into space
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1800);
            });

            // Synthesize Launch Sound
            function playLaunchSound() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 1.5);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.5);
                } catch(e) {}
            }
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
